name: Trading Bot

on:
  schedule:
    - cron: '0 * * * *'
    - cron: '30 * * * *'
  workflow_dispatch: # Manual trigger

permissions:
  contents: write
  actions: write

jobs:
  scan-and-bet:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests cryptography

      - name: Run trading bot (live)
        env:
          PM_API_KEY: ${{ secrets.PM_API_KEY }}
          PM_API_SECRET: ${{ secrets.PM_API_SECRET }}
        run: python trading_bot.py --live

      - name: Backup crypto score bets from Railway
        run: |
          python3 -c "
          import json, subprocess, sys
          # Fetch new bets from Railway
          try:
              import urllib.request
              resp = urllib.request.urlopen('https://ankurkalshi.up.railway.app/api/score-data', timeout=30)
              data = json.loads(resp.read())
              new_bets = data.get('recent_bets', [])
          except Exception as e:
              print(f'Railway API unreachable: {e}')
              sys.exit(0)
          if not new_bets:
              print('No score bets from Railway')
              sys.exit(0)
          # Load existing backup from git
          existing = []
          try:
              with open('crypto_score_bets.json') as f:
                  existing = json.load(f)
          except Exception:
              pass
          # Merge: use ticker+timestamp as unique key
          seen = set()
          for b in existing:
              key = (b.get('ticker',''), b.get('timestamp',''))
              seen.add(key)
          added = 0
          for b in new_bets:
              key = (b.get('ticker',''), b.get('timestamp',''))
              if key not in seen:
                  existing.append(b)
                  seen.add(key)
                  added += 1
          existing.sort(key=lambda x: x.get('timestamp',''))
          with open('crypto_score_bets.json', 'w') as f:
              json.dump(existing, f, indent=2, default=str)
          print(f'Score bets: {len(existing)} total ({added} new, {len(existing)-added} existing)')
          " || echo "Score backup failed, skipping"

      - name: Commit bot data
        run: |
          git config user.name "trading-bot"
          git config user.email "bot@polymarket-bot.local"
          git add trading_bot_bets.json trading_bot.log bot_status.json crypto_score_bets.json || true
          git diff --staged --quiet || git commit -m "bot: update bets $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push || true
