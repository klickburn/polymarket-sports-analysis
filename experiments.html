<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dip Tier Experiments</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d28;
    --border: #2a2d3a;
    --text: #e1e4eb;
    --muted: #8b8fa3;
    --green: #22c55e;
    --red: #ef4444;
    --blue: #3b82f6;
    --purple: #a855f7;
    --orange: #f59e0b;
    --cyan: #06b6d4;
    --yellow: #eab308;
    --teal: #14b8a6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding: 24px;
    min-height: 100vh;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .header h1 {
    font-size: 26px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--teal), var(--cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header .subtitle { color: var(--muted); font-size: 14px; }

  /* Top-level mode tabs */
  .mode-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 24px;
    border-bottom: 2px solid var(--border);
    padding-bottom: 12px;
  }
  .mode-tab {
    padding: 10px 24px;
    border-radius: 10px 10px 0 0;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    background: transparent;
    color: var(--muted);
    border: 1px solid transparent;
    border-bottom: none;
    transition: all 0.2s;
  }
  .mode-tab:hover { color: var(--text); background: rgba(255,255,255,0.05); }
  .mode-tab.active-sports { color: var(--teal); background: rgba(20,184,166,0.1); border-color: var(--teal); }
  .mode-tab.active-crypto { color: var(--orange); background: rgba(245,158,11,0.1); border-color: var(--orange); }
  .mode-tab.active-score { color: var(--purple); background: rgba(168,85,247,0.1); border-color: var(--purple); }
  .mode-tab.active-analytics { color: var(--yellow); background: rgba(234,179,8,0.1); border-color: var(--yellow); }

  /* Analytics signal cards */
  .analytics-signal-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }
  .signal-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .signal-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
  .signal-card .signal-glow {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: 12px 12px 0 0;
  }
  .signal-card .signal-name {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
    margin-top: 4px;
  }
  .signal-card .signal-wr {
    font-size: 28px;
    font-weight: 800;
    line-height: 1;
    margin-bottom: 4px;
  }
  .signal-card .signal-sub {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .signal-card .signal-bar {
    height: 6px;
    border-radius: 3px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
  }
  .signal-card .signal-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.5s ease;
  }
  .signal-card .signal-pnl {
    font-size: 13px;
    font-weight: 700;
    margin-top: 8px;
  }
  .signal-card .signal-edge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 700;
    margin-top: 6px;
  }

  /* Analytics indicator tabs */
  .analytics-indicator-tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .a-tab {
    padding: 8px 18px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .a-tab:hover { color: var(--text); background: rgba(255,255,255,0.05); }
  .a-tab.active { color: var(--yellow); background: rgba(234,179,8,0.15); border-color: var(--yellow); }
  .analytics-ind-pane { display: none; }
  .analytics-ind-pane.active { display: block; }

  /* Side stats mini cards */
  .side-stat-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .side-stat-row:last-child { border-bottom: none; }
  .side-stat-label { color: var(--muted); }
  .side-stat-value { font-weight: 700; }
  .mode-section { display: none; }
  .mode-section.active { display: block; }

  .kpi-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }
  .kpi {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    text-align: center;
  }
  .kpi .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
  .kpi .value { font-size: 26px; font-weight: 700; }
  .kpi .value.green { color: var(--green); }
  .kpi .value.red { color: var(--red); }
  .kpi .value.blue { color: var(--blue); }
  .kpi .value.purple { color: var(--purple); }
  .kpi .value.cyan { color: var(--cyan); }
  .kpi .value.orange { color: var(--orange); }
  .kpi .sub { color: var(--muted); font-size: 11px; margin-top: 4px; }

  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }
  @media (max-width: 900px) {
    .grid-2 { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .card h3 {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 16px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .chart-container { position: relative; width: 100%; }
  .chart-container.tall { height: 300px; }
  .chart-container.med { height: 260px; }

  .section-divider {
    border: none;
    border-top: 2px solid var(--border);
    margin: 36px 0 8px 0;
  }
  .section-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 32px 0 16px 0;
  }
  .section-header h2 { font-size: 20px; font-weight: 700; }
  .section-header .badge {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .badge-auto { background: rgba(20,184,166,0.2); color: var(--teal); }
  .badge-strat { background: rgba(168,85,247,0.2); color: var(--purple); }
  .badge-crypto { background: rgba(245,158,11,0.2); color: var(--orange); }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 2px solid var(--border);
    color: var(--muted);
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tr:hover { background: rgba(20,184,166,0.05); }

  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
  }
  .tag.win { background: rgba(34,197,94,0.15); color: var(--green); }
  .tag.loss { background: rgba(239,68,68,0.15); color: var(--red); }
  .tag.open { background: rgba(59,130,246,0.15); color: var(--blue); }
  .tag.pending { background: rgba(245,158,11,0.15); color: var(--orange); }
  .tag.s1 { background: rgba(59,130,246,0.15); color: var(--blue); }
  .tag.s2 { background: rgba(234,179,8,0.15); color: var(--yellow); }
  .tag.s3 { background: rgba(168,85,247,0.15); color: var(--purple); }
  .tag.s4 { background: rgba(6,182,212,0.15); color: var(--cyan); }

  .pnl-pos { color: var(--green); font-weight: 600; }
  .pnl-neg { color: var(--red); font-weight: 600; }

  .scroll-table { max-height: 500px; overflow-y: auto; }
  .scroll-table::-webkit-scrollbar { width: 6px; }
  .scroll-table::-webkit-scrollbar-track { background: var(--card); }
  .scroll-table::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab {
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    background: transparent;
    color: var(--muted);
    border: 1px solid transparent;
    transition: all 0.2s;
  }
  .tab:hover { color: var(--text); background: rgba(255,255,255,0.05); }
  .tab.active { color: var(--text); background: rgba(20,184,166,0.15); border-color: var(--teal); }

  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--muted);
  }
  .empty-state .msg { font-size: 16px; font-weight: 500; }
  .empty-state .sub { font-size: 13px; margin-top: 6px; }

  .league-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    background: rgba(107,114,128,0.15);
    color: #9ca3af;
  }
  .crypto-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
  }
  .crypto-tag.btc { background: rgba(247,147,26,0.15); color: #f7931a; }
  .crypto-tag.eth { background: rgba(98,126,234,0.15); color: #627eea; }
  .crypto-tag.sol { background: rgba(0,255,163,0.15); color: #00ffa3; }
  .crypto-tag.xrp { background: rgba(0,162,224,0.15); color: #00a2e0; }
  .crypto-tag.doge { background: rgba(196,176,64,0.15); color: #c4b040; }
  .crypto-tag.hype { background: rgba(0,206,209,0.15); color: #00ced1; }
  .crypto-tag.bnb { background: rgba(243,186,47,0.15); color: #f3ba2f; }
</style>

</head>
<body>
<div class="header">
  <div>
    <h1>Dip Tier Experiments</h1>
    <div class="subtitle">5c / 15c / 20c split dips — isolated from the production 10c book</div>
  </div>
  <div class="subtitle"><a href="/" style="color:var(--cyan)">← main dashboard</a></div>
</div>

<div class="kpi-row" id="expKpis"></div>

<div class="card">
  <h3>By tier</h3>
  <div class="scroll-table"><table id="tierTable"></table></div>
</div>

<div class="grid-2">
  <div class="card">
    <h3>Win rate vs break-even</h3>
    <div class="chart-container med"><canvas id="edgeChart"></canvas></div>
  </div>
  <div class="card">
    <h3>Cumulative P&amp;L</h3>
    <div class="chart-container med"><canvas id="expPnlChart"></canvas></div>
  </div>
</div>

<div class="card"><h3>Daily</h3><div class="scroll-table"><table id="dayTable"></table></div></div>

<script>
const money = v => { const c = v>0?'var(--green)':(v<0?'var(--red)':'var(--muted)');
  return `<span style="color:${c}">${v>=0?'+':'-'}$${Math.abs(v).toFixed(2)}</span>`; };
const CH = {};
function chart(id,cfg){ const el=document.getElementById(id); if(!el) return;
  if(CH[id]) CH[id].destroy(); CH[id]=new Chart(el.getContext('2d'),cfg); }
const AX = { responsive:true, maintainAspectRatio:false,
  plugins:{ legend:{ labels:{ color:'#c9ccd6' } } },
  scales:{ x:{ ticks:{color:'#8b8fa3'}, grid:{display:false} },
           y:{ ticks:{color:'#8b8fa3'}, grid:{color:'rgba(42,45,58,0.3)'} } } };

async function load(){
  let d; try { d = await (await fetch('/api/experiments')).json(); }
  catch(e){ document.getElementById('expKpis').innerHTML='<div class="card">failed to load</div>'; return; }
  const tiers = d.tiers || {}, keys = Object.keys(tiers);

  document.getElementById('expKpis').innerHTML = [
    {l:'Tiers live', v:keys.length, cls:'blue', sub:keys.join(' / ') || '—'},
    {l:'Fills', v:d.total_fills||0, cls:'purple', sub:'experiment only'},
    {l:'Net P&L', v:(d.total_pnl>=0?'+':'-')+'$'+Math.abs(d.total_pnl||0).toFixed(2),
     cls:(d.total_pnl>=0?'green':'red'), sub:'as traded'},
    {l:'Best tier', v:keys.length?keys.reduce((a,b)=>tiers[a].edge_pp>=tiers[b].edge_pp?a:b):'—',
     cls:'cyan', sub:'by edge vs break-even'}
  ].map(k=>`<div class="kpi"><div class="label">${k.l}</div>
    <div class="value ${k.cls}">${k.v}</div><div class="sub">${k.sub}</div></div>`).join('');

  document.getElementById('tierTable').innerHTML =
    `<thead><tr><th>Tier</th><th>Fills</th><th>Contracts</th><th>Wins</th><th>Win%</th>
     <th>Break-even</th><th>Edge</th><th>P&L</th></tr></thead><tbody>` +
    (keys.length ? keys.map(k=>{const t=tiers[k];
      const ec = t.edge_pp>=0?'var(--green)':'var(--red)';
      return `<tr><td><b>${t.tier}</b></td><td>${t.fills}</td><td>${t.contracts}</td>
        <td>${t.wins}</td><td>${t.win_rate}%</td><td>${t.break_even}%</td>
        <td style="color:${ec}">${t.edge_pp>=0?'+':''}${t.edge_pp}pp</td>
        <td>${money(t.pnl)}</td></tr>`;}).join('')
      : '<tr><td colspan="8" style="color:var(--muted)">no experiment fills yet — set SPLIT_DIP_EXTRA_TIERS</td></tr>')
    + '</tbody>';

  chart('edgeChart',{type:'bar',data:{labels:keys,datasets:[
    {label:'Win rate %',data:keys.map(k=>tiers[k].win_rate),
     backgroundColor:keys.map(k=>tiers[k].edge_pp>=0?'rgba(34,197,94,0.75)':'rgba(239,68,68,0.75)')},
    {label:'Break-even %',data:keys.map(k=>tiers[k].break_even),type:'line',
     borderColor:'#eab308',pointBackgroundColor:'#eab308',fill:false}
  ]},options:{...AX,scales:{...AX.scales,
    y:{...AX.scales.y,ticks:{color:'#8b8fa3',callback:v=>v+'%'},beginAtZero:true}}}});

  const days=(d.by_day||[]).slice().reverse(); let t=0;
  chart('expPnlChart',{type:'line',data:{labels:days.map(x=>x.day),
    datasets:[{label:'Cumulative P&L',data:days.map(x=>(t+=x.pnl).toFixed(2)),
      borderColor:'#f59e0b',backgroundColor:'rgba(245,158,11,0.12)',fill:true,
      tension:0.25,pointRadius:0}]},options:AX});

  document.getElementById('dayTable').innerHTML =
    `<thead><tr><th>Day</th><th>Fills</th><th>Wins</th><th>Win%</th><th>P&L</th></tr></thead><tbody>`+
    ((d.by_day||[]).length ? d.by_day.map(r=>`<tr><td>${r.day}</td><td>${r.fills}</td>
      <td>${r.wins}</td><td>${r.fills?(r.wins/r.fills*100).toFixed(1):0}%</td>
      <td>${money(r.pnl)}</td></tr>`).join('')
      : '<tr><td colspan="5" style="color:var(--muted)">no data yet</td></tr>')+'</tbody>';
}
load(); setInterval(load,30000);
</script>
</body>
</html>
